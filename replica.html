<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RailOne - Login</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans', sans-serif;
    background: #e8f4fb;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 0;
  }

  .screen {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    background: linear-gradient(180deg, #dff0fa 0%, #eaf5fc 55%, #f5f5f5 55.1%, #ffffff 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 24px 40px;
    position: relative;
    overflow: hidden;
  }

  /* Logo */
  .logo-wrap {
    margin-bottom: 40px;
  }
  .logo-wrap img {
    height: 64px;
    object-fit: contain;
  }

  /* Title */
  .title {
    font-family: 'Noto Sans', sans-serif;
    font-weight: 700;
    font-size: 22px;
    color: #1e2d4a;
    margin-bottom: 12px;
    text-align: center;
  }

  .welcome {
    font-family: 'Noto Sans', sans-serif;
    font-weight: 400;
    font-size: 15px;
    color: #444;
    margin-bottom: 6px;
    text-align: center;
  }

  .enter-label {
    font-family: 'Noto Sans', sans-serif;
    font-weight: 400;
    font-size: 14px;
    color: #666;
    margin-bottom: 22px;
    text-align: center;
  }

  /* PIN boxes */
  .pin-row {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    justify-content: center;
  }

  .pin-box {
    width: 46px;
    height: 52px;
    border: 2px solid #7ecde8;
    border-radius: 10px;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    color: #333;
    cursor: pointer;
    transition: border-color 0.2s, box-shadow 0.2s;
    position: relative;
    overflow: hidden;
  }

  .pin-box.filled::after {
    content: '';
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #555;
    display: block;
  }

  .pin-box.active {
    border-color: #2196f3;
    box-shadow: 0 0 0 3px rgba(33,150,243,0.15);
  }

  .pin-box.cursor::after {
    content: '';
    width: 2px;
    height: 26px;
    background: #333;
    display: block;
    animation: blink 1s step-end infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  /* Links row */
  .links-row {
    width: 100%;
    display: flex;
    justify-content: space-between;
    margin-bottom: 36px;
    padding: 0 4px;
  }

  .link-btn {
    font-family: 'Noto Sans', sans-serif;
    font-weight: 700;
    font-size: 13.5px;
    color: #1e2d6e;
    text-decoration: none;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
  }

  /* Divider */
  .divider {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 22px;
  }

  .divider-line {
    flex: 1;
    height: 1px;
    background: repeating-linear-gradient(
      to right,
      #aaa 0px, #aaa 6px,
      transparent 6px, transparent 12px
    );
  }

  .divider-text {
    font-family: 'Noto Sans', sans-serif;
    font-weight: 400;
    font-size: 13px;
    color: #888;
    white-space: nowrap;
  }

  /* Biometric section */
  .biometric-row {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    background: #fff;
    border-radius: 0;
    padding: 0 4px;
  }

  .bio-icons {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .bio-icons img {
    width: 40px;
    height: 40px;
    object-fit: contain;
  }

  /* Toggle Switch */
  .toggle-wrap {
    position: relative;
    width: 52px;
    height: 28px;
  }

  .toggle-wrap input {
    opacity: 0;
    width: 0;
    height: 0;
    position: absolute;
  }

  .toggle-slider {
    position: absolute;
    inset: 0;
    background: #ccc;
    border-radius: 34px;
    cursor: pointer;
    transition: background 0.3s;
  }

  .toggle-slider::before {
    content: '';
    position: absolute;
    width: 22px;
    height: 22px;
    left: 3px;
    top: 3px;
    background: #fff;
    border-radius: 50%;
    transition: transform 0.3s;
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
  }

  .toggle-wrap input:checked + .toggle-slider {
    background: #28a745;
  }

  .toggle-wrap input:checked + .toggle-slider::before {
    transform: translateX(24px);
  }

  /* Biometric description */
  .bio-desc {
    font-family: 'Noto Sans', sans-serif;
    font-weight: 400;
    font-size: 12.5px;
    color: #666;
    line-height: 1.6;
    margin-bottom: 32px;
    text-align: left;
    width: 100%;
    padding: 0 4px;
  }

  /* Different User */
  .diff-user {
    font-family: 'Noto Sans', sans-serif;
    font-weight: 700;
    font-size: 15px;
    color: #1a2fa0;
    cursor: pointer;
    text-align: center;
    margin-top: auto;
    padding-top: 10px;
    background: none;
    border: none;
  }

  /* Hidden real input */
  #pin-input {
    position: absolute;
    opacity: 0;
    width: 1px;
    height: 1px;
    top: -100px;
  }
</style>
</head>

<script>
  const pinInput = document.getElementById('pin-input');
  const boxes = Array.from(document.querySelectorAll('.pin-box'));
  let pinValue = '';

  function renderBoxes() {
    boxes.forEach((box, i) => {
      box.classList.remove('filled', 'active', 'cursor');
      if (i < pinValue.length) {
        box.classList.add('filled');
      } else if (i === pinValue.length) {
        box.classList.add('cursor');
      }
    });
  }

  // Tap any box to focus input
  document.getElementById('pin-row').addEventListener('click', () => {
    pinInput.focus();
  });

  pinInput.addEventListener('input', (e) => {
    const val = e.target.value.replace(/\D/g, '').slice(0, 6);
    pinInput.value = val;
    pinValue = val;
    renderBoxes();
  });

  pinInput.addEventListener('focus', () => {
    renderBoxes();
  });

  renderBoxes();
</script>
</body>
</html>
