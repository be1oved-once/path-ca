<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MD Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
/* ─── CSS Variables ─────────────────────────────────────────── */
:root {
  --radius: 10px;
  --radius-sm: 6px;
  --radius-lg: 16px;
  --transition: 0.2s ease;
  --font-body: 'Geist', sans-serif;
  --font-mono: 'Geist Mono', monospace;
  --font-serif: 'Lora', serif;
  --sidebar-w: 260px;
  --topbar-h: 56px;
}

[data-theme="dark"] {
  --bg: #0d0d0d;
  --bg2: #141414;
  --bg3: #1c1c1c;
  --bg4: #242424;
  --bg5: #2e2e2e;
  --border: #2a2a2a;
  --border2: #333;
  --text: #e8e8e8;
  --text2: #a0a0a0;
  --text3: #666;
  --accent: #cc785c;
  --accent2: #d4956e;
  --accent-bg: rgba(204,120,92,0.12);
  --code-bg: #1a1a1a;
  --code-border: #2a2a2a;
  --pre-bg: #111;
  --pre-border: #222;
  --blockquote-border: #cc785c;
  --blockquote-bg: rgba(204,120,92,0.06);
  --table-head-bg: #1a1a1a;
  --table-stripe: #141414;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
  --shadow-sm: 0 1px 6px rgba(0,0,0,0.3);
  --scrollbar: #2a2a2a;
  --scrollbar-thumb: #444;
  --tag-bg: #1e1e1e;
  --success: #4ade80;
}

[data-theme="light"] {
  --bg: #fafaf9;
  --bg2: #f5f5f4;
  --bg3: #eeeeec;
  --bg4: #e7e7e4;
  --bg5: #dededb;
  --border: #e5e5e2;
  --border2: #d8d8d5;
  --text: #1a1a1a;
  --text2: #5a5a5a;
  --text3: #999;
  --accent: #cc5500;
  --accent2: #e06030;
  --accent-bg: rgba(204,85,0,0.08);
  --code-bg: #f0efed;
  --code-border: #e0e0dc;
  --pre-bg: #f4f3f0;
  --pre-border: #e4e3e0;
  --blockquote-border: #cc5500;
  --blockquote-bg: rgba(204,85,0,0.05);
  --table-head-bg: #f0efed;
  --table-stripe: #f8f8f6;
  --shadow: 0 4px 24px rgba(0,0,0,0.08);
  --shadow-sm: 0 1px 6px rgba(0,0,0,0.06);
  --scrollbar: #e0e0dd;
  --scrollbar-thumb: #c0c0bc;
  --tag-bg: #efefec;
  --success: #16a34a;
}

/* ─── Reset ─────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 16px; scroll-behavior: smooth; }

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  transition: background var(--transition), color var(--transition);
}

/* ─── Scrollbar ─────────────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--scrollbar); }
::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }

/* ─── Layout ─────────────────────────────────────────────────── */
#app { display: flex; flex-direction: column; min-height: 100vh; }

/* ─── Topbar ─────────────────────────────────────────────────── */
#topbar {
  height: var(--topbar-h);
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(12px);
}

.topbar-logo {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 600;
  font-size: 15px;
  color: var(--text);
  text-decoration: none;
  flex-shrink: 0;
}

.topbar-logo svg { color: var(--accent); }

.topbar-divider {
  width: 1px;
  height: 20px;
  background: var(--border2);
  flex-shrink: 0;
}

.topbar-filename {
  font-size: 13px;
  color: var(--text2);
  font-family: var(--font-mono);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 200px;
  flex-shrink: 1;
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-left: auto;
  flex-shrink: 0;
}

.icon-btn {
  width: 34px;
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  color: var(--text2);
  cursor: pointer;
  transition: all var(--transition);
  font-size: 14px;
  flex-shrink: 0;
}

.icon-btn:hover {
  background: var(--bg3);
  border-color: var(--border);
  color: var(--text);
}

.icon-btn.active {
  background: var(--accent-bg);
  border-color: var(--accent);
  color: var(--accent);
}

/* Upload button */
#upload-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 12px;
  height: 34px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all var(--transition);
  white-space: nowrap;
  font-family: var(--font-body);
}

#upload-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }

#file-input { display: none; }

/* ─── Main body ──────────────────────────────────────────────── */
#main {
  display: flex;
  flex: 1;
  position: relative;
}

/* ─── Sidebar (TOC) ──────────────────────────────────────────── */
#sidebar {
  width: var(--sidebar-w);
  background: var(--bg2);
  border-right: 1px solid var(--border);
  padding: 20px 0;
  position: sticky;
  top: var(--topbar-h);
  height: calc(100vh - var(--topbar-h));
  overflow-y: auto;
  flex-shrink: 0;
  transition: transform 0.3s ease, opacity 0.3s ease;
}

#sidebar.hidden { display: none; }

.toc-title {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text3);
  padding: 0 16px 10px;
}

#toc-list { list-style: none; }

#toc-list li a {
  display: block;
  padding: 5px 16px;
  font-size: 13px;
  color: var(--text2);
  text-decoration: none;
  border-left: 2px solid transparent;
  transition: all var(--transition);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#toc-list li a:hover {
  color: var(--text);
  background: var(--bg3);
}

#toc-list li a.active {
  color: var(--accent);
  border-left-color: var(--accent);
  background: var(--accent-bg);
}

#toc-list li.toc-h2 a { padding-left: 24px; font-size: 12.5px; }
#toc-list li.toc-h3 a { padding-left: 36px; font-size: 12px; }
#toc-list li.toc-h4 a { padding-left: 48px; font-size: 11.5px; color: var(--text3); }

/* ─── Content area ───────────────────────────────────────────── */
#content-wrap {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

#content {
  max-width: 780px;
  width: 100%;
  margin: 0 auto;
  padding: 48px 40px 80px;
}

/* ─── Drop Zone ──────────────────────────────────────────────── */
#drop-zone {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: calc(100vh - var(--topbar-h));
  gap: 16px;
  text-align: center;
  padding: 40px;
}

#drop-zone.drag-over .drop-card {
  border-color: var(--accent);
  background: var(--accent-bg);
}

.drop-card {
  border: 2px dashed var(--border2);
  border-radius: var(--radius-lg);
  padding: 56px 48px;
  transition: all 0.25s ease;
  cursor: pointer;
  max-width: 480px;
  width: 100%;
}

.drop-card:hover {
  border-color: var(--accent);
  background: var(--accent-bg);
}

.drop-icon {
  width: 56px;
  height: 56px;
  background: var(--bg3);
  border-radius: var(--radius);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 20px;
  font-size: 22px;
  color: var(--accent);
}

.drop-title {
  font-size: 18px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 6px;
}

.drop-sub {
  font-size: 14px;
  color: var(--text2);
  line-height: 1.6;
}

.drop-sub span {
  color: var(--accent);
  font-weight: 500;
}

.drop-tags {
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 20px;
}

.drop-tag {
  background: var(--tag-bg);
  border: 1px solid var(--border);
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 11px;
  color: var(--text2);
  font-family: var(--font-mono);
}

/* ─── Reading Stats Bar ──────────────────────────────────────── */
#stats-bar {
  display: none;
  align-items: center;
  gap: 16px;
  padding: 8px 20px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  color: var(--text3);
  flex-wrap: wrap;
}

#stats-bar.visible { display: flex; }

.stat-item {
  display: flex;
  align-items: center;
  gap: 5px;
}

.stat-item i { font-size: 11px; color: var(--accent); }

/* ─── Markdown Output ────────────────────────────────────────── */
#md-output { display: none; }
#md-output.visible { display: block; }

/* Typography */
#md-output h1,
#md-output h2,
#md-output h3,
#md-output h4,
#md-output h5,
#md-output h6 {
  font-family: var(--font-body);
  color: var(--text);
  line-height: 1.3;
  scroll-margin-top: calc(var(--topbar-h) + 20px);
}

#md-output h1 { font-size: 2rem; font-weight: 700; margin: 0 0 28px; letter-spacing: -0.02em; }
#md-output h2 { font-size: 1.45rem; font-weight: 650; margin: 40px 0 16px; padding-bottom: 10px; border-bottom: 1px solid var(--border); letter-spacing: -0.01em; }
#md-output h3 { font-size: 1.15rem; font-weight: 600; margin: 32px 0 12px; }
#md-output h4 { font-size: 1rem; font-weight: 600; margin: 24px 0 8px; color: var(--text2); }
#md-output h5 { font-size: 0.9rem; font-weight: 600; margin: 20px 0 8px; color: var(--text2); }
#md-output h6 { font-size: 0.85rem; font-weight: 600; margin: 16px 0 8px; color: var(--text3); }

#md-output p {
  font-size: 0.9625rem;
  line-height: 1.8;
  color: var(--text);
  margin: 0 0 16px;
}

#md-output strong { font-weight: 650; color: var(--text); }
#md-output em { font-style: italic; color: var(--text); }
#md-output del { text-decoration: line-through; color: var(--text3); }

#md-output a {
  color: var(--accent);
  text-decoration: none;
  border-bottom: 1px solid transparent;
  transition: border-color var(--transition);
}

#md-output a:hover { border-bottom-color: var(--accent); }

/* Lists */
#md-output ul, #md-output ol {
  margin: 0 0 16px 24px;
  line-height: 1.8;
}

#md-output li {
  font-size: 0.9625rem;
  margin-bottom: 4px;
  color: var(--text);
}

#md-output li::marker { color: var(--accent); }

#md-output ul { list-style: disc; }
#md-output ol { list-style: decimal; }

#md-output li > ul, #md-output li > ol { margin-bottom: 4px; }

/* Task list */
#md-output input[type="checkbox"] {
  width: 14px;
  height: 14px;
  accent-color: var(--accent);
  margin-right: 6px;
  cursor: default;
}

/* Inline code */
#md-output :not(pre) > code {
  font-family: var(--font-mono);
  font-size: 0.83em;
  background: var(--code-bg);
  border: 1px solid var(--code-border);
  padding: 2px 6px;
  border-radius: 4px;
  color: var(--accent2);
  white-space: nowrap;
}

/* Code block */
.code-block-wrapper {
  position: relative;
  margin: 20px 0;
  border-radius: var(--radius);
  overflow: hidden;
  border: 1px solid var(--pre-border);
  background: var(--pre-bg);
}

.code-block-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 14px;
  background: var(--bg3);
  border-bottom: 1px solid var(--pre-border);
}

.code-lang {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text3);
  text-transform: lowercase;
  letter-spacing: 0.04em;
}

.copy-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  background: var(--bg4);
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 11.5px;
  font-family: var(--font-body);
  color: var(--text2);
  cursor: pointer;
  transition: all var(--transition);
}

.copy-btn:hover {
  background: var(--bg5);
  color: var(--text);
}

.copy-btn.copied {
  color: var(--success);
  border-color: var(--success);
}

#md-output pre {
  margin: 0;
  padding: 16px 18px;
  overflow-x: auto;
  background: var(--pre-bg);
}

#md-output pre code {
  font-family: var(--font-mono);
  font-size: 0.845rem;
  line-height: 1.7;
  color: var(--text);
  background: none;
  border: none;
  padding: 0;
  white-space: pre;
  word-break: normal;
}

/* Blockquote */
#md-output blockquote {
  border-left: 3px solid var(--blockquote-border);
  background: var(--blockquote-bg);
  padding: 14px 20px;
  margin: 20px 0;
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
}

#md-output blockquote p {
  margin: 0;
  color: var(--text2);
  font-style: italic;
  font-family: var(--font-serif);
}

/* HR */
#md-output hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: 36px 0;
}

/* Tables */
.table-wrapper {
  overflow-x: auto;
  margin: 20px 0;
  border-radius: var(--radius);
  border: 1px solid var(--border);
}

#md-output table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.9rem;
}

#md-output th {
  background: var(--table-head-bg);
  font-weight: 600;
  text-align: left;
  padding: 10px 14px;
  font-size: 0.85rem;
  color: var(--text2);
  border-bottom: 1px solid var(--border);
}

#md-output td {
  padding: 9px 14px;
  border-bottom: 1px solid var(--border);
  font-size: 0.9rem;
}

#md-output tr:last-child td { border-bottom: none; }

#md-output tr:nth-child(even) td { background: var(--table-stripe); }

/* Images */
#md-output img {
  max-width: 100%;
  border-radius: var(--radius);
  margin: 8px 0;
  border: 1px solid var(--border);
}

/* Definition lists / bold-colon pattern */
#md-output .md-img-caption {
  display: block;
  text-align: center;
  font-size: 12.5px;
  color: var(--text3);
  margin-top: -4px;
  margin-bottom: 12px;
}

/* ─── Font size control ──────────────────────────────────────── */
#md-output.font-sm { font-size: 13.5px; }
#md-output.font-md { font-size: 15.5px; }
#md-output.font-lg { font-size: 17.5px; }
#md-output.font-xl { font-size: 19.5px; }

/* ─── Font family switch ─────────────────────────────────────── */
#md-output.font-sans p,
#md-output.font-sans li { font-family: var(--font-body); }

#md-output.font-serif p,
#md-output.font-serif li { font-family: var(--font-serif); }

#md-output.font-mono p,
#md-output.font-mono li { font-family: var(--font-mono); font-size: 0.88em; }

/* ─── Reading mode ───────────────────────────────────────────── */
body.reading-mode #sidebar { display: none; }
body.reading-mode #content { max-width: 660px; }

/* ─── Toolbar (font/reading controls) ───────────────────────── */
#toolbar {
  display: none;
  align-items: center;
  gap: 4px;
  padding: 6px 16px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}

#toolbar.visible { display: flex; }

.toolbar-group {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 0 6px;
  border-right: 1px solid var(--border);
}

.toolbar-group:last-child { border-right: none; }

.toolbar-label {
  font-size: 11px;
  color: var(--text3);
  margin-right: 4px;
  white-space: nowrap;
}

.tb-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 28px;
  padding: 0 8px;
  border-radius: 4px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text2);
  font-size: 12px;
  cursor: pointer;
  transition: all var(--transition);
  font-family: var(--font-body);
  white-space: nowrap;
}

.tb-btn:hover { background: var(--bg3); color: var(--text); }
.tb-btn.active {
  background: var(--accent-bg);
  border-color: var(--accent);
  color: var(--accent);
}

/* ─── Progress bar ───────────────────────────────────────────── */
#progress-bar {
  position: fixed;
  top: 0;
  left: 0;
  height: 2px;
  background: var(--accent);
  z-index: 999;
  transition: width 0.1s linear;
  width: 0%;
}

/* ─── Responsive ─────────────────────────────────────────────── */

/* Small mobile (< 480px) */
@media (max-width: 479px) {
  :root { --topbar-h: 50px; }

  #topbar { padding: 0 12px; gap: 8px; }

  .topbar-logo span { display: none; }

  #upload-btn span { display: none; }
  #upload-btn { width: 34px; padding: 0; justify-content: center; }

  #sidebar { display: none; }

  #content { padding: 24px 16px 60px; }

  #md-output h1 { font-size: 1.5rem; }
  #md-output h2 { font-size: 1.2rem; }
  #md-output h3 { font-size: 1.05rem; }

  .drop-card { padding: 36px 24px; }
  .drop-title { font-size: 16px; }

  .toolbar-group { padding: 0 3px; }
  .tb-btn { padding: 0 5px; font-size: 11px; }
  .toolbar-label { display: none; }
}

/* Normal mobile (480–767px) */
@media (480px) and (max-width: 767px) {
  #sidebar { display: none; }
  #content { padding: 28px 20px 60px; }
  #md-output h1 { font-size: 1.65rem; }
}

/* Mobile overlay sidebar */
@media (max-width: 767px) {
  #sidebar {
    position: fixed;
    top: var(--topbar-h);
    left: 0;
    height: calc(100vh - var(--topbar-h));
    z-index: 90;
    transform: translateX(-100%);
    transition: transform 0.3s ease;
    display: block;
  }

  #sidebar.mobile-open { transform: translateX(0); }

  #sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    top: var(--topbar-h);
    background: rgba(0,0,0,0.5);
    z-index: 89;
  }

  #sidebar-overlay.visible { display: block; }
}

/* Tablet (768–1023px) */
@media (min-width: 768px) and (max-width: 1023px) {
  :root { --sidebar-w: 220px; }
  #content { padding: 36px 28px 72px; }
  #md-output h1 { font-size: 1.75rem; }
}

/* Large tablet / small laptop (1024–1279px) */
@media (min-width: 1024px) and (max-width: 1279px) {
  :root { --sidebar-w: 240px; }
  #content { padding: 44px 36px 80px; }
}

/* Desktop (1280px+) */
@media (min-width: 1280px) {
  #content { padding: 56px 48px 100px; }
}

/* Wide (1600px+) */
@media (min-width: 1600px) {
  :root { --sidebar-w: 280px; }
  #content { max-width: 860px; }
  #md-output h1 { font-size: 2.2rem; }
}

/* ─── Search bar ─────────────────────────────────────────────── */
#search-bar {
  display: none;
  position: fixed;
  top: var(--topbar-h);
  left: 50%;
  transform: translateX(-50%);
  z-index: 200;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-top: none;
  border-radius: 0 0 var(--radius) var(--radius);
  padding: 8px 12px;
  width: 480px;
  max-width: 92vw;
  box-shadow: var(--shadow);
}

#search-bar.visible { display: block; }

#search-input {
  width: 100%;
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  padding: 8px 12px 8px 36px;
  font-size: 13.5px;
  font-family: var(--font-body);
  color: var(--text);
  outline: none;
  transition: border-color var(--transition);
}

#search-input:focus { border-color: var(--accent); }
#search-input::placeholder { color: var(--text3); }

.search-wrap { position: relative; }
.search-icon {
  position: absolute;
  left: 11px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text3);
  font-size: 13px;
  pointer-events: none;
}

#search-count {
  font-size: 11px;
  color: var(--text3);
  text-align: right;
  margin-top: 4px;
  font-family: var(--font-mono);
}

/* Highlight */
mark {
  background: rgba(204,120,92,0.35);
  color: var(--text);
  border-radius: 2px;
  padding: 0 1px;
}

mark.current-mark { background: rgba(204,120,92,0.7); }

/* ─── Heading anchors ────────────────────────────────────────── */
.heading-anchor {
  opacity: 0;
  color: var(--text3);
  font-size: 0.75em;
  margin-left: 8px;
  text-decoration: none;
  transition: opacity var(--transition);
  vertical-align: middle;
}

h1:hover .heading-anchor,
h2:hover .heading-anchor,
h3:hover .heading-anchor,
h4:hover .heading-anchor { opacity: 1; }

/* ─── Empty state ────────────────────────────────────────────── */
.empty-note {
  text-align: center;
  padding: 60px 24px;
  color: var(--text3);
  font-size: 14px;
}

.empty-note i { display: block; font-size: 28px; margin-bottom: 12px; color: var(--border2); }

/* ─── Scroll to top ──────────────────────────────────────────── */
#scroll-top {
  position: fixed;
  bottom: 24px;
  right: 24px;
  width: 38px;
  height: 38px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--text2);
  font-size: 14px;
  opacity: 0;
  pointer-events: none;
  transition: all 0.25s ease;
  box-shadow: var(--shadow-sm);
  z-index: 50;
}

#scroll-top.visible {
  opacity: 1;
  pointer-events: all;
}

#scroll-top:hover { background: var(--bg4); color: var(--text); transform: translateY(-2px); }

/* ─── Footnotes ──────────────────────────────────────────────── */
#md-output .footnotes {
  margin-top: 40px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
  font-size: 0.85rem;
  color: var(--text2);
}

/* ─── Word count badge ───────────────────────────────────────── */
#word-count-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: var(--text3);
  background: var(--bg3);
  border: 1px solid var(--border);
  padding: 2px 8px;
  border-radius: 10px;
  font-family: var(--font-mono);
  margin-left: auto;
}
</style>
</head>
<body>

<div id="progress-bar"></div>

<!-- TOPBAR -->
<div id="topbar">
  <div class="topbar-logo">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14 2 14 8 20 8"/>
      <line x1="16" y1="13" x2="8" y2="13"/>
      <line x1="16" y1="17" x2="8" y2="17"/>
      <polyline points="10 9 9 9 8 9"/>
    </svg>
    <span>MD Reader</span>
  </div>

  <div class="topbar-divider"></div>
  <div class="topbar-filename" id="topbar-filename">No file loaded</div>

  <div class="topbar-actions">
    <button class="icon-btn" id="toc-toggle-btn" title="Toggle Table of Contents">
      <i class="fa-solid fa-list-ul"></i>

    </button>

      <i class="fa-solid fa-book-open"></i>
    </button>
    <button class="icon-btn" id="theme-btn" title="Toggle Theme">
      <i class="fa-solid fa-moon"></i>
    </button>
    <button id="upload-btn">
      <i class="fa-solid fa-arrow-up-from-bracket"></i>
      <span>Open File</span>
    </button>
    <input type="file" id="file-input" accept=".md,.markdown,.txt">

</div>

<!-- SEARCH BAR -->
<div id="search-bar">
  <div class="search-wrap">
    <i class="fa-solid fa-magnifying-glass search-icon"></i>
    <input type="text" id="search-input" placeholder="Search in document…" autocomplete="off" spellcheck="false">
  </div>
  <div id="search-count"></div>
</div>

<!-- SIDEBAR OVERLAY (mobile) -->
<div id="sidebar-overlay"></div>

<!-- STATS BAR -->
<div id="stats-bar">
  <div class="stat-item">
    <i class="fa-solid fa-align-left"></i>

  <div class="stat-item">

  <div class="stat-item">

<!-- TOOLBAR -->
<div id="toolbar">

  </div>

  <div class="toolbar-group">
    <span class="toolbar-label">Size</span>
    <button class="tb-btn" onclick="setSize('sm')">S</button>
    <button class="tb-btn active" onclick="setSize('md')">M</button>
    <button class="tb-btn" onclick="setSize('lg')">L</button>

<!-- MAIN -->

  <!-- SIDEBAR TOC -->

      <!-- DROP ZONE -->

            Click to browse or <span>drop your .md file</span> here
          </div>

            <span class="drop-tag">.txt</span>

<!-- SCROLL TO TOP -->

  <i class="fa-solid fa-chevron-up"></i>
</button>

<script>
/* ────────────────────────────────────────────────────────────
   MD READER — Full Engine
   ──────────────────────────────────────────────────────────── */

let rawMarkdown = '';
let currentFont = 'sans';
let currentSize = 'md';
let searchMatches = [];
let searchIndex = 0;
let currentTheme = 'dark';

// ── DOM refs ──
const $  = id => document.getElementById(id);
const mdOut     = $('md-output');
const dropZone  = $('drop-zone');
const sidebar   = $('sidebar');
const tocList   = $('toc-list');
const statsBar  = $('stats-bar');
const toolbar   = $('toolbar');
const searchBar = $('search-bar');
const searchInput = $('search-input');
const progressBar = $('progress-bar');
const scrollTop = $('scroll-top');
const fileInput = $('file-input');

// ── Theme ──
function setTheme(t) {
  currentTheme = t;
  document.documentElement.setAttribute('data-theme', t);
  $('theme-btn').innerHTML = t === 'dark'
    ? '<i class="fa-solid fa-sun"></i>'
    : '<i class="fa-solid fa-moon"></i>';
  localStorage.setItem('md-theme', t);
}

$('theme-btn').onclick = () => setTheme(currentTheme === 'dark' ? 'light' : 'dark');

// ── TOC toggle ──
$('toc-toggle-btn').onclick = () => {
  const isMobile = window.innerWidth < 768;
  if (isMobile) {
    sidebar.classList.toggle('mobile-open');
    $('sidebar-overlay').classList.toggle('visible');
  } else {
    sidebar.classList.toggle('hidden');
  }
  $('toc-toggle-btn').classList.toggle('active', !sidebar.classList.contains('hidden'));
};

$('sidebar-overlay').onclick = () => {
  sidebar.classList.remove('mobile-open');
  $('sidebar-overlay').classList.remove('visible');
};

// ── Reading mode ──
$('reading-mode-btn').onclick = () => {
  document.body.classList.toggle('reading-mode');
  $('reading-mode-btn').classList.toggle('active', document.body.classList.contains('reading-mode'));
};

// ── Search ──
$('search-toggle-btn').onclick = toggleSearch;

function toggleSearch() {
  searchBar.classList.toggle('visible');
  if (searchBar.classList.contains('visible')) {
    searchInput.focus();
    $('search-toggle-btn').classList.add('active');
  } else {
    clearSearch();
    $('search-toggle-btn').classList.remove('active');
  }
}

searchInput.addEventListener('input', () => {
  doSearch(searchInput.value);
});

searchInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') nextMatch(e.shiftKey ? -1 : 1);
  if (e.key === 'Escape') toggleSearch();
});

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
    e.preventDefault();
    if (rawMarkdown) toggleSearch();
  }
});

function doSearch(query) {
  clearHighlights();
  searchMatches = [];
  searchIndex = 0;

  if (!query.trim()) {
    $('search-count').textContent = '';
    return;
  }

  const walker = document.createTreeWalker(mdOut, NodeFilter.SHOW_TEXT);
  const regex = new RegExp(escapeRegex(query), 'gi');
  const nodes = [];
  let n;
  while (n = walker.nextNode()) nodes.push(n);

  nodes.forEach(node => {
    const txt = node.textContent;
    if (!regex.test(txt)) return;
    regex.lastIndex = 0;

    const frag = document.createDocumentFragment();
    let last = 0, m;
    while (m = regex.exec(txt)) {
      if (m.index > last) frag.appendChild(document.createTextNode(txt.slice(last, m.index)));
      const mark = document.createElement('mark');
      mark.textContent = m[0];
      frag.appendChild(mark);
      searchMatches.push(mark);
      last = m.index + m[0].length;
    }
    if (last < txt.length) frag.appendChild(document.createTextNode(txt.slice(last)));
    node.parentNode.replaceChild(frag, node);
  });

  if (searchMatches.length > 0) {
    setCurrentMatch(0);
  }
  $('search-count').textContent = searchMatches.length > 0
    ? `${searchIndex + 1} / ${searchMatches.length} matches`
    : 'No matches';
}

function nextMatch(dir) {
  if (!searchMatches.length) return;
  setCurrentMatch((searchIndex + dir + searchMatches.length) % searchMatches.length);
  $('search-count').textContent = `${searchIndex + 1} / ${searchMatches.length} matches`;
}

function setCurrentMatch(i) {
  searchMatches.forEach(m => m.classList.remove('current-mark'));
  searchIndex = i;
  const el = searchMatches[i];
  if (el) {
    el.classList.add('current-mark');
    el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }
}

function clearHighlights() {
  document.querySelectorAll('#md-output mark').forEach(m => {
    const txt = document.createTextNode(m.textContent);
    m.parentNode.replaceChild(txt, m);
  });
  mdOut.normalize();
}

function clearSearch() {
  clearHighlights();
  searchInput.value = '';
  $('search-count').textContent = '';
  searchMatches = [];
}

function escapeRegex(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

// ── Font / Size ──
function setFont(f) {
  mdOut.classList.remove('font-sans', 'font-serif', 'font-mono');
  mdOut.classList.add('font-' + f);
  currentFont = f;
  document.querySelectorAll('[id^="font-"]').forEach(b => b.classList.remove('active'));
  $('font-' + f + '-btn').classList.add('active');
}

function setSize(s) {
  mdOut.classList.remove('font-sm', 'font-md', 'font-lg', 'font-xl');
  mdOut.classList.add('font-' + s);
  currentSize = s;
  document.querySelectorAll('.toolbar-group:nth-child(2) .tb-btn').forEach(b => {
    b.classList.toggle('active', b.textContent.trim().toLowerCase() === s);
  });
}

// ── Copy all raw MD ──
function copyAll() {
  if (!rawMarkdown) return;
  navigator.clipboard.writeText(rawMarkdown).then(() => {
    const btn = document.querySelector('.tb-btn:has(.fa-copy)');
    if (btn) {
      btn.innerHTML = '<i class="fa-solid fa-check"></i>&nbsp;Copied!';
      btn.style.color = 'var(--success)';
      setTimeout(() => {
        btn.innerHTML = '<i class="fa-regular fa-copy"></i>&nbsp;Copy MD';
        btn.style.color = '';
      }, 2000);
    }
  });
}

// ── Print ──
function printDoc() { window.print(); }

// ── File input ──
$('upload-btn').onclick = () => fileInput.click();
fileInput.onchange = e => {
  const file = e.target.files[0];
  if (file) loadFile(file);
  fileInput.value = '';
};

// ── Drag & Drop ──
const dz = dropZone;
document.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
document.addEventListener('dragleave', e => { if (!e.relatedTarget) dz.classList.remove('drag-over'); });
document.addEventListener('drop', e => {
  e.preventDefault();
  dz.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file && (file.name.endsWith('.md') || file.name.endsWith('.markdown') || file.name.endsWith('.txt'))) {
    loadFile(file);
  }
});

function loadFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    rawMarkdown = e.target.result;
    $('topbar-filename').textContent = file.name;
    renderMarkdown(rawMarkdown);
  };
  reader.readAsText(file);
}

// ── Scroll / progress ──
window.addEventListener('scroll', () => {
  const scrolled = window.scrollY;
  const total = document.documentElement.scrollHeight - window.innerHeight;
  const pct = total > 0 ? (scrolled / total) * 100 : 0;
  progressBar.style.width = pct + '%';
  scrollTop.classList.toggle('visible', scrolled > 400);
  updateActiveToc();
});

scrollTop.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });

// ── Active TOC ──
function updateActiveToc() {
  const headings = document.querySelectorAll('#md-output h1,#md-output h2,#md-output h3,#md-output h4');
  let active = null;
  headings.forEach(h => {
    if (h.getBoundingClientRect().top < 100) active = h.id;
  });
  document.querySelectorAll('#toc-list a').forEach(a => {
    a.classList.toggle('active', a.getAttribute('href') === '#' + active);
  });
}

// ── The Markdown Parser ──────────────────────────────────────
function parseMarkdown(md) {
  // Normalize line endings
  let html = md.replace(/\r\n/g, '\n').replace(/\r/g, '\n');

  // Escape HTML entities in code blocks FIRST (we'll process them specially)
  const codeBlocks = [];
  html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    const idx = codeBlocks.length;
    codeBlocks.push({ lang: lang.trim() || 'text', code: code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') });
    return `\x00CODE${idx}\x00`;
  });

  // Inline code
  const inlineCodes = [];
  html = html.replace(/`([^`\n]+?)`/g, (_, code) => {
    const idx = inlineCodes.length;
    inlineCodes.push(code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'));
    return `\x00ICODE${idx}\x00`;
  });

  // Headings
  html = html.replace(/^#{6}\s+(.+)$/gm, (_, t) => `<h6>${t.trim()}${anchor(t.trim())}</h6>`);
  html = html.replace(/^#{5}\s+(.+)$/gm, (_, t) => `<h5>${t.trim()}${anchor(t.trim())}</h5>`);
  html = html.replace(/^#{4}\s+(.+)$/gm, (_, t) => `<h4>${t.trim()}${anchor(t.trim())}</h4>`);
  html = html.replace(/^#{3}\s+(.+)$/gm, (_, t) => `<h3>${t.trim()}${anchor(t.trim())}</h3>`);
  html = html.replace(/^#{2}\s+(.+)$/gm, (_, t) => `<h2>${t.trim()}${anchor(t.trim())}</h2>`);
  html = html.replace(/^#{1}\s+(.+)$/gm, (_, t) => `<h1>${t.trim()}${anchor(t.trim())}</h1>`);

  // Setext headings
  html = html.replace(/^(.+)\n={3,}$/gm, (_, t) => `<h1>${t.trim()}${anchor(t.trim())}</h1>`);
  html = html.replace(/^(.+)\n-{3,}$/gm, (_, t) => `<h2>${t.trim()}${anchor(t.trim())}</h2>`);

  // Horizontal rule
  html = html.replace(/^(\s*[-*_]){3,}\s*$/gm, '<hr>');

  // Blockquote
  html = html.replace(/(^>.*\n?)+/gm, match => {
    const inner = match.replace(/^>\s?/gm, '');
    return `<blockquote><p>${inner.trim()}</p></blockquote>\n`;
  });

  // Tables
  html = html.replace(/^\|(.+)\|\n\|[-| :]+\|\n((?:\|.+\|\n?)*)/gm, (_, header, body) => {
    const heads = header.split('|').filter(c => c.trim() !== '').map(c => `<th>${c.trim()}</th>`).join('');
    const rows = body.trim().split('\n').map(row => {
      const cells = row.split('|').filter(c => c.trim() !== '').map(c => `<td>${c.trim()}</td>`).join('');
      return `<tr>${cells}</tr>`;
    }).join('');
    return `<div class="table-wrapper"><table><thead><tr>${heads}</tr></thead><tbody>${rows}</tbody></table></div>\n`;
  });

  // Task list
  html = html.replace(/^(\s*)- \[x\] (.+)$/gim, '$1<li><input type="checkbox" checked disabled> $2</li>');
  html = html.replace(/^(\s*)- \[ \] (.+)$/gim, '$1<li><input type="checkbox" disabled> $2</li>');

  // Unordered lists
  html = html.replace(/(^[-*+] .+\n?)+/gm, match => {
    const items = match.trim().split('\n').map(l => `<li>${l.replace(/^[-*+] /, '')}</li>`).join('');
    return `<ul>${items}</ul>\n`;
  });

  // Ordered lists
  html = html.replace(/(^\d+\. .+\n?)+/gm, match => {
    const items = match.trim().split('\n').map(l => `<li>${l.replace(/^\d+\. /, '')}</li>`).join('');
    return `<ol>${items}</ol>\n`;
  });

  // Images
  html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" loading="lazy">');

  // Links
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

  // Bold + italic
  html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  html = html.replace(/___(.+?)___/g, '<strong><em>$1</em></strong>');

  // Bold
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/__(.+?)__/g, '<strong>$1</strong>');

  // Italic
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  html = html.replace(/_([^_]+)_/g, '<em>$1</em>');

  // Strikethrough
  html = html.replace(/~~(.+?)~~/g, '<del>$1</del>');

  // Restore inline code
  html = html.replace(/\x00ICODE(\d+)\x00/g, (_, i) => `<code>${inlineCodes[i]}</code>`);

  // Restore code blocks
  html = html.replace(/\x00CODE(\d+)\x00/g, (_, i) => {
    const { lang, code } = codeBlocks[i];
    return `<div class="code-block-wrapper"><div class="code-block-header"><span class="code-lang">${lang}</span><button class="copy-btn" onclick="copyCode(this)"><i class="fa-regular fa-copy"></i> Copy</button></div><pre><code class="language-${lang}">${code}</code></pre></div>`;
  });

  // Paragraphs (wrap bare lines)
  html = html.replace(/^(?!<[a-z]|$|\s*$)(.*\S.*)/gm, '<p>$1</p>');

  return html;
}

function anchor(text) {
  const id = slugify(text);
  return `<a class="heading-anchor" href="#${id}" aria-hidden="true"><i class="fa-solid fa-link"></i></a>`;
}

function slugify(text) {
  return text.toLowerCase()
    .replace(/[^\w\s-]/g, '')
    .replace(/[\s_-]+/g, '-')
    .replace(/^-+|-+$/g, '');
}

// ── Copy code ──
function copyCode(btn) {
  const code = btn.closest('.code-block-wrapper').querySelector('code').innerText;
  navigator.clipboard.writeText(code).then(() => {
    btn.innerHTML = '<i class="fa-solid fa-check"></i> Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.innerHTML = '<i class="fa-regular fa-copy"></i> Copy';
      btn.classList.remove('copied');
    }, 2000);
  });
}

// ── Render ──
function renderMarkdown(md) {
  const html = parseMarkdown(md);
  mdOut.innerHTML = html;

  // Add IDs to headings
  mdOut.querySelectorAll('h1,h2,h3,h4,h5,h6').forEach(h => {
    const text = h.childNodes[0]?.textContent?.trim() || '';
    h.id = slugify(text);
  });

  // Build TOC
  buildTOC();

  // Update stats
  updateStats(md);

  // Show output
  dropZone.style.display = 'none';
  mdOut.classList.add('visible');
  statsBar.classList.add('visible');
  toolbar.classList.add('visible');

  // Restore font/size
  setFont(currentFont);
  setSize(currentSize);
}

function buildTOC() {
  tocList.innerHTML = '';
  const headings = mdOut.querySelectorAll('h1,h2,h3,h4');
  if (headings.length === 0) {
    tocList.innerHTML = '<li style="padding:8px 16px;font-size:12px;color:var(--text3)">No headings found</li>';
    return;
  }
  headings.forEach(h => {
    const level = parseInt(h.tagName[1]);
    const text = h.childNodes[0]?.textContent?.trim() || '';
    const li = document.createElement('li');
    li.className = 'toc-h' + level;
    const a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = text;
    a.onclick = () => {
      if (window.innerWidth < 768) {
        sidebar.classList.remove('mobile-open');
        $('sidebar-overlay').classList.remove('visible');
      }
    };
    li.appendChild(a);
    tocList.appendChild(li);
  });
}

function updateStats(md) {
  const words = md.trim().split(/\s+/).filter(Boolean).length;
  const readTime = Math.max(1, Math.round(words / 200));
  const headings = mdOut.querySelectorAll('h1,h2,h3,h4,h5,h6').length;
  const codeBlocks = mdOut.querySelectorAll('.code-block-wrapper').length;
  const links = mdOut.querySelectorAll('a').length;

  $('stat-words').textContent = words.toLocaleString() + ' words';
  $('stat-read').textContent = readTime + ' min read';
  $('stat-headings').textContent = headings + ' headings';
  $('stat-code').textContent = codeBlocks + ' code blocks';
  $('stat-links').textContent = links + ' links';
}
